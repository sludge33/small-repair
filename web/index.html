<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1f1a16" />
    <meta name="description" content="Small Repairs: restore one broken object per session; sound and haptics are the reward." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Small Repairs</title>
  </head>
  <body>
    <div id="surface"><div id="marker" hidden></div></div>
    <div id="parcel" hidden></div>
    <div id="overlay" hidden></div>
    <div id="tools" hidden></div>
    <button id="wrap" type="button" hidden>Wrap it up</button>
    <button id="again" type="button" hidden>Again</button>
    <div id="cure" hidden>
      <p>The lacquer is curing.</p>
      <p class="quiet">Tap to lift the lid early.</p>
    </div>
    <div id="desk" hidden>
      <button id="envelope" type="button" aria-label="Open the envelope" hidden></button>
      <article id="letter" hidden></article>
      <button id="letter-done" type="button" hidden></button>
    </div>
    <div id="ghost" hidden></div>
    <div id="start">
      <h1>Small Repairs</h1>
      <p>One broken bowl, placeholder art and sound. Headphones recommended.</p>
      <button id="begin" type="button">Begin</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
